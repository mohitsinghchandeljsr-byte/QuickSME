ShortDescription: Ultra-fast, keyboard-friendly accounting application for Indian SMEs
Description: |-
  SME Tally is a blazing-fast, keyboard-friendly web-based accounting application designed specifically for Indian SMEs. 
  
  Built as a modern alternative to traditional ERP systems, it features:
  - Comprehensive GST compliance (CGST, SGST, IGST)
  - Voucher-based double-entry accounting
  - Stock management with barcode scanner integration
  - AI-powered assistant (AIassist) for accounting insights
  - Developer API platform with webhooks
  - Enterprise security with role-based access control
  - Bank reconciliation and expense tracking
  - Real-time financial reporting
  
  Performance: 5-10x faster than SAP, Oracle, Tally, or Microsoft Dynamics for daily operations through aggressive client-side caching, keyboard shortcuts, and optimistic UI updates.
  
  Built with React, TypeScript, Express.js, and PostgreSQL.
